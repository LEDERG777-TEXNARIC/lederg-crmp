name: LEDERG PROJECT quality checks

on:
  push:
    branches:
      - main
      - feature/lederg-project-rebrand
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-source-and-database:
    name: Source and database regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify branding, registration, SQL schema, and startup guards
        run: python tools/verify_rebrand.py
